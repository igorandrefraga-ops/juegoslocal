<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whac-A-Mole · Arcade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- juego11.css es autocontenido: trae sus variables y estilos base -->
  <link rel="stylesheet" href="CSS/juego1.css">
</head>
<body>

  <header class="top">
    <a class="logo" href="index.html"><i></i>Arcade</a>
    <a class="volver" href="index.html">Volver al inicio</a>
  </header>

  <main class="sec topo-page">
    <div class="wrap">
      <h1>Whac-A-Mole</h1>
      <p class="lead">Golpea al topo antes de que se esconda. Cada clic en una madriguera vacía cuesta un intento.</p>

      <section class="hud" aria-label="Marcador">
        <div class="hud-puntos"><small>Puntos</small><b id="puntos">0 / 10</b></div>
        <div class="hud-tiempo"><small>Tiempo</small><b id="tiempo">30</b></div>
        <div class="hud-intentos"><small>Intentos</small><b id="intentos">5</b></div>
      </section>

      <div class="tablero-wrap" id="tablero-wrap">
        <div class="row row-cols-3 g-3" id="tablero">
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 1"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 2"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 3"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 4"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 5"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 6"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 7"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 8"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
          <div class="col"><button type="button" class="casilla" aria-label="Madriguera 9"><span class="salida"><img class="topo" src="img/topo.png" alt="" draggable="false"></span><span class="hoyo"></span></button></div>
        </div>

        <!-- Pantalla de inicio / ganar / perder -->
        <div class="overlay" id="overlay" role="dialog" aria-live="polite">
          <h2 id="ov-titulo">¿Listo?</h2>
          <p id="ov-texto">Golpea 10 topos en 30 segundos. Tienes 5 intentos.</p>
          <p id="ov-mejor" class="mejor" hidden></p>
          <button type="button" class="btn-neon" id="btn-jugar">Iniciar</button>
        </div>
      </div>

      <div class="acciones">
        <button type="button" class="btn-neon ghost" id="btn-reiniciar">Reiniciar</button>
        <a class="btn-neon ghost" href="index.html">Volver al inicio</a>
      </div>
    </div>
  </main>

  <footer>Whac-A-Mole · Proyecto colaborativo</footer>

  <script src="JS/juego1.js"></script>
</body>
</html>
